
{% extends "arena/base.html" %}

{% block title %}
    NullPtrArena - Submit
{% endblock %}

{% block content %}

<div>
    <h1>Double Input</h1>
    <p>Write a program that accepts an integer as input and outputs the double of that integer.</p>
    <br />
    <form method="post">
        {% csrf_token %}
        <textarea 
            name="editor"
            id="editor_el"
            rows="12"
            cols="80"
            placeholder="write your program here"></textarea><br />
        <label for="language">Language: </label>
        <select name="language">
            <option value="python">Python</option>
            <option value="cpp">c++</option>
            <option value="java">Java</option>
        </select>
        <button>Submit Code</button>
    </form>
    <br />
    <h2>Output</h2>
    <pre id="output">{{ output }}</pre>
</div>
{% endblock %}
